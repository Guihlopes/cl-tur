function childRule(t,birth){

  let age=ageAtDate(birth,t.departure);if(age===null)return {eligible:false,age:null,price:Number(t?.price||0),needsSeat:true};

  return {eligible:false,age,price:Number(t.price||0),needsSeat:true};
}
function ageAtDate(birth,date){if(!birth||!date)return null;let b=birth.split('-').map(Number),d=date.split('-').map(Number);if(b.length!==3||d.length!==3||b.some(Number.isNaN)||d.some(Number.isNaN))return null;let age=d[0]-b[0];if(d[1]<b[1]||(d[1]===b[1]&&d[2]<b[2]))age--;return age<0?null:age}
function passengerRuleHtml(t,i,birth){let r=childRule(t,birth);if(!birth)return `<div id="rule_${i}" class="child-rule">📅 Informe a data de nascimento para o sistema verificar automaticamente a regra de criança desta excursão.</div>`;if(r.eligible){return `<div id="rule_${i}" class="child-rule free">👶 <b>Criança — ${r.age} ano${r.age===1?'':'s'}</b>: não paga o transporte e <b>não ocupa poltrona</b>.${r.price>0?` Valor de hospedagem/outros: <b>${money(r.price)}</b>.`:''}</div>`}return `<div id="rule_${i}" class="child-rule">👤 <b>Passageiro — ${r.age} ano${r.age===1?'':'s'}</b>: valor da excursão <b>${money(r.price)}</b> e precisa de poltrona.</div>`}
function seatAreaHtml(t,i,sel,birth){let r=childRule(t,birth);if(!birth)return `<div id="seatArea_${i}" class="no-seat" style="background:#fff8e7;border-color:#fde68a;color:#854d0e">⚠️ Informe a data de nascimento para liberar ou ocultar a escolha de poltrona.</div>`;if(r.eligible){if(sel)delete reservationSeats[i];return `<div id="seatArea_${i}" class="no-seat">🧒 Esta criança irá no colo e <b>não terá poltrona reservada</b>.</div>`}return `<div id="seatArea_${i}" style="margin-top:14px"><b>Escolha o assento</b>${renderSeatMaps(t,i,sel)}${sel?`<div class="selected-seat">✓ ${vehicleLabel(t.vehicles[sel.vehicleIndex],sel.vehicleIndex)} · Assento ${sel.seat}</div>`:''}</div>`}
function reserve(id){let t=data.trips.find(x=>x.id==id);if(!t)return;let vagas=totalSeats(t)-occupied(t.id);reservationSeats={};modal.innerHTML=`<div class="modalbox"><div class="reservation-top-grid">${t.image?`<div class="reservation-image-wrap"><img class="reservation-trip-image" src="${t.image}" alt="Arte da excursão ${esc(t.destination)}"></div>`:''}<div class="reservation-trip-info"><div class="modalhead"><div><div class="reservation-title">RESERVA DE EXCURSÃO</div><h2>${esc(t.destination)}</h2><p class="reservation-trip-meta">📅 ${fmt(t.departure)} · 📍 ${esc(t.origin||'A confirmar')} · <b>${money(t.price)} por pessoa</b></p>${t.notes?`<div class="reservation-trip-description">${esc(t.notes)}</div>`:``}</div><button class="close" onclick="closeModal()">×</button></div></div></div><div class="notice">Informe a data de nascimento de cada passageiro. Se esta excursão tiver uma regra especial para crianças, o sistema identificará automaticamente se paga, o valor e se precisa de poltrona.</div><form onsubmit="submitReservation(event,'${id}')"><div class="field" style="margin-top:16px"><label>Quantidade de pessoas</label><input id="qty" name="qty" type="number" min="1" max="99" value="1" required oninput="renderPeople('${id}',this.value)"></div><div id="people"></div><div id="reservationSummary" class="reservation-summary"><span>Passageiros: <b>1</b></span><span>Poltronas: <b>0/${vagas}</b></span><span>Total: <b>${money(t.price)}</b></span></div><div class="client-help"><b>Ficou com alguma dúvida?</b><span>Fale diretamente com a equipe da CL TUR.</span><br><a href="https://wa.me/5534999146922?text=Ol%C3%A1!%20Tenho%20uma%20d%C3%BAvida%20sobre%20uma%20viagem%20da%20CL%20TUR." target="_blank" rel="noopener">💬 Falar com a CL TUR no WhatsApp</a></div><div class="actions"><button type="button" class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary">Enviar reserva</button></div></form></div>`;modal.classList.remove('hidden');renderPeople(id,1)}
function renderPeople(id,qty){let t=data.trips.find(x=>x.id==id),max=99;qty=Math.max(1,Math.min(Number(qty)||1,max));let box=document.getElementById('people');if(!box)return;let saved={};box.querySelectorAll('input[name]').forEach(el=>{saved[el.name]=el.value});for(let k in reservationSeats)if(Number(k)>=qty)delete reservationSeats[k];box.innerHTML=Array.from({length:qty},(_,i)=>{let sel=reservationSeats[i]||null,birth=saved[`r_birth_${i}`]||'';let rule=childRule(t,birth);if(rule.eligible&&sel){delete reservationSeats[i];sel=null}return `<div class="passenger"><h3>Passageiro ${i+1}</h3><div class="formgrid"><div class="field"><label>Nome completo</label><input name="r_name_${i}" value="${esc(saved[`r_name_${i}`]||'')}" required></div><div class="field"><label>Data de nascimento</label><input type="date" name="r_birth_${i}" value="${esc(birth)}" required onchange="updatePassengerRule('${id}',${i},this.value)"></div><div class="field"><label>CPF</label><input name="r_cpf_${i}" value="${esc(saved[`r_cpf_${i}`]||'')}" required></div><div class="field"><label>Identidade / RG</label><input name="r_rg_${i}" value="${esc(saved[`r_rg_${i}`]||'')}" required></div><div class="field"><label>Telefone / WhatsApp</label><input name="r_phone_${i}" value="${esc(saved[`r_phone_${i}`]||'')}" required></div><div class="field full"><label>Endereço completo</label><input name="r_address_${i}" value="${esc(saved[`r_address_${i}`]||'')}" required></div></div>${passengerRuleHtml(t,i,birth)}<div id="price_${i}" class="passenger-price">💰 Valor deste passageiro: <strong>${money(rule.price)}</strong></div>${seatAreaHtml(t,i,sel,birth)}</div>`}).join('');updateReservationTotal(id)}
function updatePassengerRule(id,i,birth){let t=data.trips.find(x=>x.id==id);if(!t)return;let r=childRule(t,birth),ruleEl=document.getElementById(`rule_${i}`),priceEl=document.getElementById(`price_${i}`),seatEl=document.getElementById(`seatArea_${i}`);if(r.eligible&&reservationSeats[i])delete reservationSeats[i];if(ruleEl)ruleEl.outerHTML=passengerRuleHtml(t,i,birth);if(priceEl)priceEl.innerHTML=`💰 Valor deste passageiro: <strong>${money(r.price)}</strong>`;let sel=reservationSeats[i]||null;if(seatEl)seatEl.outerHTML=seatAreaHtml(t,i,sel,birth);updateReservationTotal(id)}
function updateReservationTotal(id){let t=data.trips.find(x=>x.id==id),qty=Number(document.getElementById('qty')?.value||0),total=0,seats=0,missing=0;for(let i=0;i<qty;i++){let birth=document.querySelector(`[name="r_birth_${i}"]`)?.value||'';if(!birth){missing++;total+=Number(t.price||0);continue}let r=childRule(t,birth);total+=Number(r.price||0);if(r.needsSeat)seats++}let box=document.getElementById('reservationSummary');if(box)box.innerHTML=`<span>Passageiros: <b>${qty}</b></span><span>Poltronas: <b>${seats}/${Math.max(0,totalSeats(t)-occupied(t.id))}</b></span><span>Total: <b>${money(total)}</b></span>${missing?`<span style="flex-basis:100%;color:#854d0e">⚠️ Preencha a data de nascimento de todos os passageiros para confirmar o valor.</span>`:''}`}
function renderSeatMaps(t,i,sel){return `<div class="seatmap-wrap">${(t.vehicles||[]).map((v,vi)=>`<div class="vehicle-seat-panel"><h4>${esc(vehicleLabel(v,vi))} · ${v.seats} lugares</h4><div class="vehicle-seat-grid">${Array.from({length:Number(v.seats||0)},(_,n)=>{let seat=n+1,taken=seatTaken(t.id,vi,seat),selected=sel&&Number(sel.vehicleIndex)===vi&&Number(sel.seat)===seat,other=Object.keys(reservationSeats).some(k=>Number(k)!==i&&reservationSeats[k]&&Number(reservationSeats[k].vehicleIndex)===vi&&Number(reservationSeats[k].seat)===seat);return `<button type="button" class="seat ${taken?'taken':''} ${selected?'selected':''}" ${taken||other?'disabled':''} onclick="chooseSeat(${i},${vi},${seat},'${t.id}')">${seat}${taken?'<small>ocupado</small>':selected?'<small>selecionado</small>':''}</button>`}).join('')}</div></div>`).join('')}</div>`}
function chooseSeat(i,vi,seat,id){if(seatTaken(id,vi,seat))return;if(Object.keys(reservationSeats).some(k=>Number(k)!==i&&reservationSeats[k]&&Number(reservationSeats[k].vehicleIndex)===vi&&Number(reservationSeats[k].seat)===seat))return alert('Esse assento já foi escolhido para outro passageiro.');reservationSeats[i]={vehicleIndex:vi,seat};renderPeople(id,Number(document.getElementById('qty')?.value||1))}
function showReservationConfirmation(t,qty,total){let waText=encodeURIComponent('Olá! Acabei de fazer uma pré-reserva na CL TUR para '+t.destination+'. Gostaria de receber as orientações para confirmar a reserva e realizar o pagamento.');modal.innerHTML=`<div class="modalbox"><div class="reservation-confirm"><div class="confirm-icon">✓</div><h2>RESERVA REALIZADA!</h2><p class="confirm-sub">Sua pré-reserva foi recebida pela <b>CL TUR Transporte & Turismo</b>.</p><div class="confirm-summary"><h3>🎫 Resumo da excursão</h3><div class="summary-row"><span class="summary-label">Destino</span><span class="summary-value">${esc(t.destination)}</span></div><div class="summary-row"><span class="summary-label">📅 Data da viagem</span><span class="summary-value">${fmt(t.departure)}${t.returnDate?' → '+fmt(t.returnDate):''}</span></div><div class="summary-row"><span class="summary-label">📍 Local de saída</span><span class="summary-value">${esc(t.origin||'A confirmar')}</span></div><div class="summary-row"><span class="summary-label">💰 Valor total da pré-reserva</span><span class="summary-value">${money(total)}</span></div></div><div class="confirm-payment"><b>💳 Pagamento</b><br>Para confirmar sua reserva, entre em contato com a CL TUR pelo WhatsApp para receber as orientações e combinar a forma de pagamento.<br><a class="whatsapp-confirm" href="https://wa.me/5534999146922?text=${waText}" target="_blank" rel="noopener">📱 Falar com a CL TUR pelo WhatsApp</a></div><div class="confirm-actions"><button class="btn primary" onclick="closeModal();publicPage()">✅ Concluir</button></div></div></div>`;modal.classList.remove('hidden')}

async function submitReservation(e,id){
 e.preventDefault();
 let t=data.trips.find(x=>x.id==id),f=new FormData(e.target),qty=Number(f.get('qty'));
 if(!t)return alert('Não foi possível localizar esta excursão. Atualize a página e tente novamente.');
 if(qty<1||qty>99)return alert('Quantidade de pessoas inválida.');
 let seatsNeeded=0,total=0,rows=[];
 for(let i=0;i<qty;i++){
  let birth=f.get('r_birth_'+i);if(!birth)return alert(`Informe a data de nascimento do passageiro ${i+1}.`);
  let r=childRule(t,birth);total+=Number(r.price||0);
  if(r.needsSeat){seatsNeeded++;if(!reservationSeats[i])return alert(`Escolha o assento do passageiro ${i+1}.`);if(seatTaken(id,reservationSeats[i].vehicleIndex,reservationSeats[i].seat))return alert(`O assento ${reservationSeats[i].seat} acabou de ser ocupado.`)}else if(reservationSeats[i])delete reservationSeats[i];
  rows.push({i,birth,r});
 }
 let availableSeats=totalSeats(t)-occupied(t.id);
 if(seatsNeeded>availableSeats)return alert(`Não há poltronas suficientes. São necessárias ${seatsNeeded} e há ${availableSeats} disponíveis.`);
 const passageiros=rows.map(row=>{
  const i=row.i,r=row.r,seatData=r.needsSeat?reservationSeats[i]:null;
  return {nome:f.get('r_name_'+i),nascimento:f.get('r_birth_'+i),cpf:f.get('r_cpf_'+i),rg:f.get('r_rg_'+i),endereco:f.get('r_address_'+i),telefone:f.get('r_phone_'+i),assento:seatData?String(seatData.seat):'',veiculo:seatData?String(seatData.vehicleIndex+1):'',valor:Number(r.price||0),regra_infantil_aplicada:!!r.eligible,idade_infantil:r.age};
 });
 const btn=e.target.querySelector('button[type="submit"],button:not([type])');if(btn){btn.disabled=true;btn.dataset.originalText=btn.textContent;btn.textContent='Enviando pedido...';}
 try{
  await sendCLTURPortalRequest('reserva',{excursao:t.destination||t.title||'Excursão',trip_id:String(t.id),data_viagem:t.departure||'',data_retorno:t.returnDate||'',origem:t.origin||'A confirmar',passageiros,total:Number(total.toFixed(2)),moeda:'BRL'});
  showReservationConfirmation(t,qty,total);
 }catch(error){alert(error.message||'Falha ao enviar a pré-reserva. Confira sua conexão e tente novamente.');if(btn){btn.disabled=false;btn.textContent=btn.dataset.originalText||'Enviar pedido';}}
}

function freight(){modal.innerHTML=`<div class="modalbox"><div class="modalhead"><div><div style="font-size:12px;font-weight:900;color:#0f3d5e">FRETAMENTO CL TUR</div><h2 style="margin:5px 0">Solicite seu orçamento</h2><p style="margin:0;color:#64748b">Para família, grupo, empresa, evento, passeio ou excursão particular.</p></div><button class="close" onclick="closeModal()">×</button></div><form onsubmit="submitFreight(event)"><div class="formgrid" style="margin-top:18px"><div class="field"><label>Seu nome</label><input name="client" required placeholder="Nome completo"></div><div class="field"><label>Telefone / WhatsApp</label><input name="phone" required placeholder="(34) 99999-9999"></div><div class="field"><label>Local de saída</label><input name="origin" required placeholder="Cidade ou endereço"></div><div class="field"><label>Destino</label><input name="destination" required placeholder="Cidade ou endereço"></div><div class="field"><label>Data de saída</label><input type="date" name="date" required></div><div class="field"><label>Hora de saída</label><input type="time" name="departureTime" required></div><div class="field"><label>Data de retorno</label><input type="date" name="returnDate"></div><div class="field"><label>Hora do retorno</label><input type="time" name="returnTime"></div><div class="field"><label>Quantidade de passageiros</label><input type="number" name="passengers" min="1" required placeholder="Ex.: 35"></div><div class="field"><label>Veículo desejado</label><select name="vehicle"><option value="A definir">Quero orientação</option><option>Van</option><option>Ônibus</option><option>Van + Ônibus</option><option>2 Ônibus</option></select></div><div class="field full"><label>Conte mais sobre sua viagem</label><textarea name="notes" placeholder="Ex.: evento, passeio, horários, paradas, necessidade de bagageiro etc."></textarea></div></div><div class="notice">Este formulário é uma <b>solicitação de orçamento</b>. A equipe da CL TUR entrará em contato para confirmar disponibilidade, veículo e valor.</div><div class="actions"><button type="button" class="btn outline" onclick="closeModal()">Cancelar</button><button class="btn primary">Solicitar orçamento →</button></div></form></div>`;modal.classList.remove('hidden')}
async function submitFreight(e){
  e.preventDefault();
  let f=new FormData(e.target);
  const c={nome:f.get('client'),telefone:f.get('phone'),origem:f.get('origin'),destino:f.get('destination'),data_saida:f.get('date'),hora_saida:f.get('departureTime')||'',data_retorno:f.get('returnDate')||'',hora_retorno:f.get('returnTime')||'',passageiros:Number(f.get('passengers')||0),veiculo:f.get('vehicle')||'A definir',observacoes:f.get('notes')||''};
  const btn=e.target.querySelector('button[type="submit"],button:not([type])');if(btn){btn.disabled=true;btn.dataset.originalText=btn.textContent;btn.textContent='Enviando pedido...';}

  }catch(error){

    if(btn){btn.disabled=false;btn.textContent=btn.dataset.originalText||'Solicitar orçamento →';}
