(function(){
  function initAuth(){
    const sb=window.clturSupabase;
    const screen=document.getElementById('cltur-auth-screen');
    const form=document.getElementById('cltur-auth-form');
    const btn=document.getElementById('cltur-auth-btn');
    const err=document.getElementById('cltur-auth-error');
    const logout=document.getElementById('cltur-logout');
    if(!sb || !screen || !form || !btn || !err || !logout) return;
    function showLogin(message){
      screen.style.display='flex'; logout.style.display='none';
      if(message){err.textContent=message;err.style.display='block';}
    }
    function hideLogin(){screen.style.display='none';logout.style.display='block';}
    async function checkAdmin(session){
      if(!session){showLogin();return false;}
      const {data:profile,error}=await sb.from('profiles').select('id,nome,cargo,ativo').eq('id',session.user.id).maybeSingle();
      if(error){showLogin('Não foi possível validar seu acesso. Tente novamente.');return false;}
      if(!profile || profile.ativo!==true || profile.cargo!=='Administrador'){
        await sb.auth.signOut(); showLogin('Este usuário não possui acesso administrativo.'); return false;
      }
      hideLogin(); return true;
    }
    form.addEventListener('submit',async function(e){
      e.preventDefault(); err.style.display='none'; btn.disabled=true; btn.textContent='Entrando...';
      const email=document.getElementById('cltur-email').value.trim();
      const password=document.getElementById('cltur-password').value;
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error){showLogin('E-mail ou senha inválidos.');btn.disabled=false;btn.textContent='Entrar';return;}
      const ok=await checkAdmin(data.session);
      if(!ok){btn.disabled=false;btn.textContent='Entrar';return;}
      btn.disabled=false;btn.textContent='Entrar';
    });
    logout.addEventListener('click',async()=>{await sb.auth.signOut();location.reload();});
    sb.auth.onAuthStateChange(async(_event,session)=>{await checkAdmin(session);});
    window.CLTUR_AUTH_READY=checkAdmin;
    sb.auth.getSession().then(({data})=>checkAdmin(data.session));
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initAuth,{once:true});
  else initAuth();
})();
</script>

</head><body>
<div class="app"><aside class="side"><div class="brand"><img src="/mnt/data/870982.jpg" onerror="this.style.display='none'"><div><b>CL TUR</b><br><small>Transporte & Turismo</small></div></div><nav class="nav"><button data-page="dashboard" class="active">📊 Dashboard</button><button data-page="trips">🚌 Excursões</button><button data-page="people">👥 Passageiros</button><button data-page="charters">🚐 Fretamentos</button><button data-page="finance">💰 Financeiro</button><button data-page="calendar">📅 Calendário</button><button data-page="public">🌐 Área do cliente</button></nav></aside><main class="main" id="main"></main></div><div style="position:fixed;bottom:8px;right:14px;font-size:11px;color:#98a2b3;pointer-events:none">CL TUR • Sistema administrativo</div>

<script>
// Referências explícitas ao DOM para garantir que o Dashboard seja renderizado no carregamento/recarregamento.
const main=document.getElementById('main');
const modal=document.getElementById('modal');
const KEY='cltur_data_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'null')||{};
// Normaliza os dados de versões anteriores para que nenhuma seção do Dashboard
// quebre quando alguma coleção ainda não existir no localStorage.
if(!Array.isArray(data.trips)) data.trips=[];
if(!Array.isArray(data.people)) data.people=[];
if(!Array.isArray(data.charters)) data.charters=[];
if(!Array.isArray(data.expenses)) data.expenses=[];
if(!Array.isArray(data.payments)) data.payments=[];
function passengerPayments(pid){return data.payments.filter(x=>x.personId==pid).sort((a,b)=>(b.date||'').localeCompare(a.date||''))}
function paymentTotal(p){let arr=passengerPayments(p.id);return arr.length?arr.reduce((a,x)=>a+Number(x.amount||0),0):Number(p.paid||0)}
function paymentStatus(p){let paid=paymentTotal(p), value=Number(p.value||0);if(value>0&&paid>=value)return 'Confirmado';if(paid>0)return 'Parcial';return p.status==='Cancelado'?'Cancelado':'Pendente'}
function paymentMethodLabel(m){return m==='Pix'?'📲 Pix':m==='Cartão'?'💳 Cartão':m==='Dinheiro'?'💵 Dinheiro':'🏦 Transferência'}

function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function money(v){return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function fmt(d){if(!d)return '-';let [y,m,day]=d.split('-');return `${day}/${m}/${y}`}
function tripName(id){return data.trips.find(t=>t.id==id)?.destination||'—'}
function totalSeats(t){return (t.vehicles||[]).reduce((a,v)=>a+Number(v.seats||0),0)}
function occupied(tid){return data.people.filter(p=>p.tripId==tid&&p.seat).length}
function seatTaken(tid,vehicleIndex,seat,ignoreId=''){return data.people.some(p=>p.tripId==tid&&p.id!=ignoreId&&Number(p.vehicleIndex||0)===Number(vehicleIndex)&&String(p.seat||'')===String(seat))}
function vehicleLabel(v,i){return `${v.type||'Veículo'} ${i+1}`}
function assignedPassenger(tid,vehicleIndex,seat){return data.people.find(p=>p.tripId==tid&&Number(p.vehicleIndex||0)===Number(vehicleIndex)&&String(p.seat||'')===String(seat))}
function openModal(html){modal.innerHTML='<div class="modalbox">'+html+'</div>';modal.classList.remove('hidden')}
function closeModal(){modal.classList.add('hidden');modal.innerHTML=''}
modal.addEventListener('click',e=>{if(e.target===modal)closeModal()})
function layout(title,body,action=''){let dash=title==='Dashboard';return `<div class="top ${dash?'dashboard-head':''}"><div><div class="admin-eyebrow">CL TUR • Painel administrativo</div><h1>${title}</h1><p class="admin-subtitle">${dash?'Gerencie excursões, passageiros, fretamentos e financeiro em um só lugar.':'Controle e organize as operações da CL TUR.'}</p></div>${action}</div>${body}`}
function render(page='dashboard'){
 document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
 if(page==='dashboard')dashboard(); if(page==='trips')trips(); if(page==='people')people(); if(page==='charters')charters(); if(page==='finance')finance(); if(page==='calendar')calendar(); if(page==='reports')reports(); if(page==='public')publicPage();
}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>render(b.dataset.page));
if(Array.isArray(data.charters)){let changed=false;data.charters.forEach(c=>{if(['Orçamento solicitado','Orçamento'].includes(c.status) && !Number(c.value||0)){c.status='Aguardando fechamento';changed=true}});if(changed)localStorage.setItem(KEY,JSON.stringify(data))}
function dashboard(){
  const today=new Date(); today.setHours(0,0,0,0);
  const upcoming=data.trips.filter(t=>new Date((t.departure||'9999-12-31')+'T00:00')>=today)
    .sort((a,b)=>(a.departure||'').localeCompare(b.departure||''));
  const confirmed=data.people.filter(p=>paymentStatus(p)==='Confirmado').length;
  const peopleRevenue=data.people.reduce((a,p)=>a+Number(p.value||0),0);
  const peopleReceived=data.people.reduce((a,p)=>a+paymentTotal(p),0);
  const charterRevenue=data.charters.reduce((a,c)=>a+charterFinancialContract(c),0);
  const charterReceived=data.charters.reduce((a,c)=>a+charterFinancialReceived(c),0);
  const expenses=data.expenses.reduce((a,e)=>a+Number(e.value||0),0);
  const plannedCosts=data.trips.reduce((a,t)=>a+Number(t.costs||0),0);
  const totalRevenue=peopleRevenue+charterRevenue;
  const totalReceived=peopleReceived+charterReceived;
  const pending=Math.max(0,totalRevenue-totalReceived);
  const currentResult=totalReceived-expenses;
  const projected=totalRevenue-plannedCosts-expenses;
  const openCharters=data.charters.filter(c=>!['Concluído','Cancelado'].includes(c.status)).length;
  const pendingPeople=data.people.filter(p=>paymentStatus(p)==='Parcial'||paymentStatus(p)==='Pendente').length;

  const nextRows=upcoming.slice(0,6).map(t=>{
    const total=totalSeats(t), occ=occupied(t.id), free=Math.max(0,total-occ);
    const pct=total?Math.round((occ/total)*100):0;
    return `<tr>
      <td><b>${esc(t.destination)}</b><br><small>${esc(t.origin||'')}</small></td>
      <td>${fmt(t.departure)}${t.time?' · '+esc(t.time):''}</td>
      <td>${(t.vehicles||[]).map(v=>esc(v.type)+' ('+v.seats+')').join(' + ')}</td>
      <td><b>${free}</b> / ${total}<br><small>${pct}% ocupados</small></td>
      <td><div class="action-buttons"><button class="btn secondary" onclick="tripFinance('${t.id}')">💰 Financeiro</button><button class="btn secondary" onclick="seatMap('${t.id}')">💺 Assentos</button></div></td>
    </tr>`;
  }).join('');

  const tripReport=data.trips.slice().sort((a,b)=>(a.departure||'').localeCompare(b.departure||'')).map(t=>{
    const ps=data.people.filter(p=>p.tripId==t.id);
    const contracted=ps.reduce((a,p)=>a+Number(p.value||0),0);
    const received=ps.reduce((a,p)=>a+paymentTotal(p),0);
    const costs=data.expenses.filter(e=>e.tripId==t.id&&!e.charterId).reduce((a,e)=>a+Number(e.value||0),0);
    const result=received-costs;
    const pendingTrip=Math.max(0,contracted-received);
    return `<tr><td><b>🚌 ${esc(t.destination)}</b><br><small>${fmt(t.departure)}</small></td><td>${money(contracted)}</td><td>${money(received)}</td><td>${money(pendingTrip)}</td><td>${money(costs)}</td><td class="${result>=0?'result-positive':'result-negative'}"><b>${money(result)}</b></td></tr>`;
  }).join('');

  const charterReport=data.charters.slice().sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(c=>{
    const contracted=charterFinancialContract(c);
    const received=charterFinancialReceived(c);
    const costs=data.expenses.filter(e=>e.charterId==c.id).reduce((a,e)=>a+Number(e.value||0),0);
    const pendingCharter=Math.max(0,contracted-received);
    const result=charterIsFinancial(c)?received-costs:0;
    const statusLabel=c.status||'Aguardando fechamento';
    return `<tr><td><b>🚐 ${esc(c.client||'Fretamento')}</b><br><small>${fmt(c.date)} · ${esc(c.destination||'')} · ${esc(statusLabel)}</small></td><td>${money(contracted)}</td><td>${money(received)}</td><td>${money(pendingCharter)}</td><td>${money(costs)}</td><td class="${result>=0?'result-positive':'result-negative'}"><b>${charterIsFinancial(c)?money(result):'—'}</b></td></tr>`;
  }).join('');

  main.innerHTML=layout('Dashboard',`
    <div class="final-hero" style="display:flex;justify-content:space-between;align-items:center;gap:18px"><div>
      <h2>Visão geral da CL TUR</h2>
      <p>Acompanhe as operações, o financeiro e o que precisa de atenção em um único painel.</p></div><button id="dashboardNotificationBell" class="dashboard-bell" onclick="openNotifications()" title="Notificações">🔔<i id="dashboardNotificationDot" class="notification-dot"></i><span>Notificações</span></button>
    </div>
    <div id="dashboardNotificationAlert"></div>

    <div class="cards">
      <div class="card"><div class="kpi-icon">🚌</div><div class="kpi-label">Próximas excursões</div><strong>${upcoming.length}</strong></div>
      <div class="card"><div class="kpi-icon">👥</div><div class="kpi-label">Passageiros confirmados</div><strong>${confirmed}</strong></div>
      <div class="card"><div class="kpi-icon">💰</div><div class="kpi-label">Total a receber</div><strong>${money(pending)}</strong></div>
      <div class="card"><div class="kpi-icon">📈</div><div class="kpi-label">Resultado atual</div><strong class="${currentResult>=0?'result-positive':'result-negative'}">${money(currentResult)}</strong></div>
    </div>

    <div class="panel">
      <div class="section-heading" style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
        <div><h2>📊 Relatório geral</h2><p class="muted">Resumo financeiro consolidado de excursões e fretamentos.</p></div>
        <button class="btn secondary" onclick="render('finance')">Abrir financeiro completo</button>
      </div>
      <div class="cards">
        <div class="card"><small>Receita contratada</small><strong>${money(totalRevenue)}</strong><p class="muted">Excursões + fretamentos</p></div>
        <div class="card"><small>Total recebido</small><strong>${money(totalReceived)}</strong><p class="muted">Valores já registrados</p></div>
        <div class="card"><small>Total a receber</small><strong>${money(pending)}</strong><p class="muted">Saldos em aberto</p></div>
        <div class="card"><small>Custos realizados</small><strong>${money(expenses)}</strong><p class="muted">Despesas lançadas</p></div>
        <div class="card"><small>Resultado atual</small><strong class="${currentResult>=0?'result-positive':'result-negative'}">${money(currentResult)}</strong><p class="muted">Recebido − custos</p></div>
        <div class="card"><small>Resultado projetado</small><strong class="${projected>=0?'result-positive':'result-negative'}">${money(projected)}</strong><p class="muted">Considerando receitas e custos previstos</p></div>
      </div>
      <div class="report-summary-strip">
        <div><span>Excursões</span><b>${data.trips.length}</b></div>
        <div><span>Fretamentos</span><b>${data.charters.length}</b></div>
        <div><span>Publicadas</span><b>${data.trips.filter(t=>t.published).length}</b></div>
        <div><span>Fretamentos em aberto</span><b>${openCharters}</b></div>
        <div><span>Pagamentos pendentes</span><b>${pendingPeople}</b></div>
      </div>
      ${tripReport||charterReport?`<div class="report-tables">

      <div class="panel"><h2>💳 Pagamentos pendentes</h2><p class="muted">Passageiros com saldo em aberto.</p><h3 style="font-size:28px;margin:10px 0">${pendingPeople}</h3><button class="btn secondary" onclick="render('people')">Ver passageiros</button></div>

function trips(){main.innerHTML=layout('Excursões',`<div class="panel"><button class="btn" onclick="tripForm()">+ Nova excursão</button></div><div class="panel"><table class="table"><tr><th>Destino</th><th>Data</th><th>Veículos</th><th>Preço</th><th>Vagas</th><th>Status</th><th></th></tr>${data.trips.map(t=>`<tr><td><b>${esc(t.destination)}</b><br><small>${esc(t.origin)}</small></td><td>${fmt(t.departure)}${t.returnDate?' → '+fmt(t.returnDate):''}</td><td>${(t.vehicles||[]).map(v=>v.type+' · '+v.seats).join('<br>')}</td><td>${money(t.price)}</td><td>${totalSeats(t)-occupied(t.id)} / ${totalSeats(t)}</td><td><span class="pill ${t.published?'ok':''}">${t.published?'Publicado':'Privado'}</span></td><td><div class="action-buttons"><button class="btn secondary" onclick="tripForm('${t.id}')">Editar</button><button class="btn secondary" onclick="seatMap('${t.id}')">💺 Assentos</button><button class="btn secondary" onclick="tripFinance('${t.id}')">💰 Financeiro</button><button class="btn secondary" onclick="tripRoute('${t.id}')">📲 Roteiro</button><button class="btn danger" onclick="delTrip('${t.id}')">Excluir</button></div></td></tr>`).join('')}</table></div>`)}
function vehicleOptions(selected){return ['Van','Ônibus'].map(x=>`<option ${selected===x?'selected':''}>${x}</option>`).join('')}
function tripForm(id){let t=data.trips.find(x=>x.id==id)||{destination:'',origin:'',departure:'',returnDate:'',time:'',price:'',costs:'',notes:'',routeMessage:'',published:true,image:'',vehicles:[{type:'Van',seats:16}],childRuleEnabled:false,childFreeTransportAge:'',childExtraPrice:0};let vehicles=t.vehicles?.length?t.vehicles:[{type:'Van',seats:16}];openModal(`<h2>${id?'Editar':'Nova'} excursão</h2><form onsubmit="saveTrip(event,'${id||''}')"><div class="formgrid"><div class="field"><label>Destino</label><input name="destination" value="${esc(t.destination)}" required></div><div class="field"><label>Origem</label><input name="origin" value="${esc(t.origin)}"></div><div class="field"><label>Data de saída</label><input type="date" name="departure" value="${t.departure}" required></div><div class="field"><label>Data de retorno</label><input type="date" name="returnDate" value="${t.returnDate||''}"></div><div class="field"><label>Horário</label><input type="time" name="time" value="${t.time||''}"></div><div class="field"><label>Preço por pessoa</label><input type="number" step="0.01" name="price" value="${t.price||''}"></div><div class="field"><label>Custos previstos</label><input type="number" step="0.01" name="costs" value="${t.costs||''}"></div><div class="field"><label>Publicar na área do cliente</label><select name="published"><option value="1" ${t.published?'selected':''}>Sim</option><option value="0" ${!t.published?'selected':''}>Não</option></select></div><div class="field full"><label>📝 Descrição completa da excursão</label><textarea name="notes" rows="8" placeholder="Escreva aqui o texto comercial da viagem: roteiro, valores, o que está incluso, formas de pagamento, condições, etc.">${esc(t.notes)}</textarea><small class="muted" style="display:block;margin-top:7px">Esse texto aparece na área do cliente para apresentar a excursão.</small></div><div class="field full"><label>📋 Roteiro e orientações aos passageiros</label><textarea name="routeMessage" rows="12" placeholder="Ex.: pontos de embarque, horários, tolerância, parada para café, documentos, regras e demais orientações da viagem.">${esc(t.routeMessage||'')}</textarea><small class="muted" style="display:block;margin-top:7px">Mensagem específica desta excursão. Depois, use o botão 📲 Roteiro na lista de excursões para enviar aos passageiros cadastrados nesta viagem.</small></div><div class="field full"><label>👶 Regra especial para crianças</label><div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:12px;border:1px solid #dbe2ea;border-radius:10px;background:#f8fafc"><label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700"><input type="checkbox" name="childRuleEnabled" ${t.childRuleEnabled?'checked':''}> Esta excursão possui regra especial</label><div class="field"><label>Até quantos anos?</label><input type="number" min="0" max="17" step="1" name="childFreeTransportAge" value="${t.childFreeTransportAge??''}" placeholder="Ex.: 6"></div><div class="field"><label>Valor de hospedagem/outros (R$)</label><input type="number" min="0" step="0.01" name="childExtraPrice" value="${Number(t.childExtraPrice||0)||''}" placeholder="Ex.: 100,00"></div></div><small class="muted" style="display:block;margin-top:7px">Até a idade informada, a criança não paga o transporte e não ocupa poltrona. Se houver hospedagem ou outro custo, informe o valor acima; o sistema calculará automaticamente ao receber a data de nascimento.</small></div><div class="field excursion-image-field"><label>Imagem/arte da excursão</label><div class="excursion-image-preview">${t.image?`<img src="${t.image}" alt="Arte da excursão">`:'<div style="font-size:42px">🖼️</div>'}<div style="flex:1"><input type="file" name="image" accept="image/*"><small class="muted" style="display:block;margin-top:7px">Envie a arte da viagem. Ela aparecerá em destaque quando o cliente abrir a excursão.</small>${t.image?'<label style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px"><input type="checkbox" name="removeImage"> Remover imagem atual</label>':''}</div></div></div></div><hr><h3>Veículos da excursão</h3><div class="choice"><label><input type="radio" name="vehicleMode" value="van" onchange="setVehicleMode('van')"> 1 Van</label><label><input type="radio" name="vehicleMode" value="bus" onchange="setVehicleMode('bus')"> 1 Ônibus</label><label><input type="radio" name="vehicleMode" value="mix" onchange="setVehicleMode('mix')"> Van + Ônibus</label><label><input type="radio" name="vehicleMode" value="2bus" onchange="setVehicleMode('2bus')"> 2 Ônibus</label></div><div id="vehicleFields"></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">Salvar excursão</button></div></form>`);let mode=vehicles.length===2?(vehicles.filter(v=>v.type==='Ônibus').length===2?'2bus':'mix'):(vehicles[0]?.type==='Ônibus'?'bus':'van');document.querySelector(`input[name=vehicleMode][value=${mode}]`).checked=true;setVehicleMode(mode,vehicles)}


async function fileToDataURL(file){return new Promise((resolve,reject)=>{if(!file){resolve('');return}let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}

function setVehicleMode(mode,old){let defs={van:[['Van',old?.[0]?.seats||16]],bus:[['Ônibus',old?.[0]?.seats||46]],mix:[['Van',old?.find(v=>v.type==='Van')?.seats||16],['Ônibus',old?.find(v=>v.type==='Ônibus')?.seats||46]],'2bus':[['Ônibus',old?.[0]?.seats||46],['Ônibus',old?.[1]?.seats||46]]};document.getElementById('vehicleFields').innerHTML=defs[mode].map((v,i)=>`<div class="vehicle-box"><div class="vehicle-head"><b>${v[0]} ${defs[mode].length>1?'#'+(i+1):''}</b><span>Capacidade</span></div><div class="vehicle-grid"><select name="vtype${i}">${vehicleOptions(v[0])}</select><input type="number" min="1" name="vseats${i}" value="${v[1]}" oninput="calcVehicleTotal(${defs[mode].length})"></div></div>`).join('')+`<div class="totalbox">Total de lugares: <span id="vehicleTotal">${defs[mode].reduce((a,v)=>a+Number(v[1]),0)}</span></div>`}
function calcVehicleTotal(n){let s=0;for(let i=0;i<n;i++)s+=Number(document.querySelector(`[name=vseats${i}]`)?.value||0);document.getElementById('vehicleTotal').textContent=s}
async function saveTrip(e,id){e.preventDefault();let f=new FormData(e.target);let childAgeRaw=f.get('childFreeTransportAge');let childEnabled=f.get('childRuleEnabled')==='on'||(childAgeRaw!==null&&String(childAgeRaw).trim()!=='');if(childEnabled&&String(childAgeRaw||'').trim()===''){alert('Informe a idade limite da regra especial para crianças.');return}let mode=e.target.vehicleMode.value;let n={van:1,bus:1,mix:2,'2bus':2}[mode],vehicles=[];for(let i=0;i<n;i++)vehicles.push({type:f.get('vtype'+i),seats:Number(f.get('vseats'+i))});let old=id?data.trips.find(t=>t.id==id):null;let image=old?.image||'';if(f.get('removeImage'))image='';let file=e.target.querySelector('input[name="image"]')?.files?.[0];if(file)image=await fileToDataURL(file);let obj={id:id||Date.now().toString(),destination:f.get('destination'),origin:f.get('origin'),departure:f.get('departure'),returnDate:f.get('returnDate'),time:f.get('time'),price:Number(f.get('price')||0),costs:Number(f.get('costs')||0),notes:f.get('notes'),routeMessage:f.get('routeMessage')||'',published:f.get('published')==='1',image,vehicles,childRuleEnabled:childEnabled,childFreeTransportAge:childEnabled&&String(childAgeRaw||'').trim()!==''?Number(childAgeRaw):'',childExtraPrice:childEnabled?Number(f.get('childExtraPrice')||0):0};if(id){let i=data.trips.findIndex(t=>t.id==id);data.trips[i]=obj}else data.trips.push(obj);closeModal();save();render('trips')}
function tripRoute(id){let t=data.trips.find(x=>x.id==id);if(!t)return;let ps=data.people.filter(p=>p.tripId==id);let valid=ps.filter(p=>String(p.phone||'').replace(/\D/g,'').length>=10);openModal(`<h2>📲 Roteiro — ${esc(t.destination)}</h2><p class="muted">${fmt(t.departure)}${t.returnDate?' → '+fmt(t.returnDate):''}</p><div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr));margin:14px 0"><div class="card"><small>Passageiros</small><strong>${ps.length}</strong></div><div class="card"><small>Com WhatsApp</small><strong>${valid.length}</strong></div><div class="card"><small>Sem telefone</small><strong>${ps.length-valid.length}</strong></div></div><div class="field"><label>Mensagem que será enviada</label><textarea id="routeMessageEdit" rows="16">${esc(t.routeMessage||'')}</textarea></div><div class="notice" style="margin-top:12px">⚠️ No protótipo, o sistema abre as conversas do WhatsApp com a mensagem pronta. O envio final de cada conversa ainda precisa ser confirmado no WhatsApp. Na versão com integração oficial, isso poderá ser automatizado.</div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Fechar</button><button type="button" class="btn secondary" onclick="saveRouteMessage('${id}')">💾 Salvar roteiro</button><button type="button" class="btn" onclick="sendTripRoute('${id}')">📲 Enviar aos passageiros</button></div>`)}
function saveRouteMessage(id){let t=data.trips.find(x=>x.id==id);let el=document.getElementById('routeMessageEdit');if(!t||!el)return;t.routeMessage=el.value;save();alert('Roteiro salvo com sucesso.');}
function sendTripRoute(id){let t=data.trips.find(x=>x.id==id);if(!t)return;let msg=String(document.getElementById('routeMessageEdit')?.value||t.routeMessage||'').trim();let ps=data.people.filter(p=>p.tripId==id),valid=ps.filter(p=>String(p.phone||'').replace(/\D/g,'').length>=10);if(!msg){alert('Digite o roteiro antes de enviar.');return}if(!valid.length){alert('Nenhum passageiro desta excursão possui telefone/WhatsApp cadastrado.');return}t.routeMessage=msg;save();if(!confirm(`Abrir o WhatsApp para ${valid.length} passageiro(s) desta excursão?`))return;valid.forEach((p,i)=>{setTimeout(()=>{let phone=whatsappBR(p.phone);let url='https://wa.me/'+phone+'?text='+encodeURIComponent(msg);window.open(url,'_blank','noopener');},i*900)});alert(`Foram preparados ${valid.length} contatos. O navegador/WhatsApp pode bloquear algumas abas; nesse caso, abra os contatos individualmente pelo botão de roteiro.`)}

function delTrip(id){if(confirm('Excluir esta excursão?')){data.trips=data.trips.filter(t=>t.id!=id);data.people=data.people.filter(p=>p.tripId!=id);save();render('trips')}}
function people(){
  const cards=data.trips.slice().sort((a,b)=>(a.departure||'').localeCompare(b.departure||'')).map(t=>{
    const ps=data.people.filter(p=>p.tripId==t.id), paid=ps.filter(p=>paymentStatus(p)==='Confirmado').length, partial=ps.filter(p=>paymentStatus(p)==='Parcial').length, pending=ps.filter(p=>paymentStatus(p)==='Pendente').length;
    return `<div class="trip-card" onclick="peopleDetail('${t.id}')"><div style="display:flex;justify-content:space-between;gap:10px"><div><h3>🚌 ${esc(t.destination)}</h3><div class="meta">${fmt(t.departure)}${t.returnDate?' → '+fmt(t.returnDate):''} · ${esc(t.origin||'')}</div></div><span class="pill ${t.published?'ok':''}">${t.published?'Publicado':'Privado'}</span></div><div class="stats"><div class="stat"><small>Passageiros</small><b>${ps.length} / ${totalSeats(t)}</b></div><div class="stat"><small>Pagos</small><b class="result-positive">${paid}</b></div><div class="stat"><small>Pendentes</small><b class="${pending?'result-negative':''}">${pending}</b>${partial?`<small style="margin-top:2px">${partial} parcial(is)</small>`:''}</div></div><div style="margin-top:13px;color:#0b5cff;font-size:12px;font-weight:800">Abrir passageiros →</div></div>`;
  }).join('');
  main.innerHTML=layout('Passageiros',`<div class="panel"><div class="section-heading"><div><h2>Passageiros por excursão</h2><p class="muted">Escolha uma excursão para visualizar dados pessoais, assentos e pagamentos.</p></div><button class="btn" onclick="personForm()">+ Novo passageiro</button></div>${cards?`<div class="trip-card-grid">${cards}</div>`:'<div class="empty">Cadastre uma excursão para começar a organizar os passageiros.</div>'}</div>`);
}
function peopleDetail(tid){
  const t=data.trips.find(x=>x.id==tid); if(!t)return;
  const ps=data.people.filter(p=>p.tripId==tid), paid=ps.reduce((a,p)=>a+paymentTotal(p),0), contract=ps.reduce((a,p)=>a+Number(p.value||0),0), pending=Math.max(0,contract-paid);
  const rows=ps.map(p=>{let pp=paymentTotal(p),pend=Math.max(0,Number(p.value||0)-pp),st=paymentStatus(p);return `<tr><td><b>${esc(p.name)}</b><br><small>${esc(p.phone||'')}</small></td><td>${esc(p.cpf||'—')}</td><td>${esc(p.rg||'—')}</td><td>${p.seat?`💺 ${esc(p.seat)}`:'—'}</td><td>${money(p.value)}</td><td>${money(pp)}</td><td>${money(pend)}</td><td><span class="pill ${st==='Confirmado'?'ok':st==='Parcial'?'warn':''}">${st}</span></td><td><div class="action-buttons"><button class="btn secondary" onclick="paymentForm('${p.id}')">💳 Pagamentos</button><button class="btn secondary" onclick="personForm('${p.id}')">Editar</button><button class="btn danger" onclick="delPerson('${p.id}');peopleDetail('${tid}')">Excluir</button></div></td></tr>`}).join('');
  main.innerHTML=layout('Passageiros',`<div class="panel"><div class="passenger-detail-head"><div><button class="btn secondary" onclick="render('people')">← Voltar às excursões</button><div style="margin-top:14px"><div class="admin-eyebrow">PASSAGEIROS DA EXCURSÃO</div><h2 style="margin:4px 0">🚌 ${esc(t.destination)}</h2><p class="muted">${fmt(t.departure)}${t.returnDate?' → '+fmt(t.returnDate):''} · ${esc(t.origin||'')}</p></div></div><div class="summary"><span class="mini-pill">👥 ${ps.length} passageiros</span><span class="mini-pill">💳 ${money(paid)} recebidos</span><span class="mini-pill">⏳ ${money(pending)} pendentes</span></div></div></div><div class="panel"><div class="section-heading"><div><h2>Lista de passageiros</h2><p class="muted">Dados pessoais, assentos e situação de pagamento.</p></div><button class="btn" onclick="personForm('', '${t.id}')">+ Adicionar passageiro</button></div>${rows?`<div style="overflow:auto"><table class="table"><tr><th>Passageiro</th><th>CPF</th><th>RG</th><th>Assento</th><th>Valor</th><th>Pago</th><th>Pendente</th><th>Status</th><th></th></tr>${rows}</table></div>`:'<div class="empty">Nenhum passageiro cadastrado nesta excursão.</div>'}</div>`);
}

function personForm(id,presetTripId=''){let existing=data.people.find(x=>x.id==id),p=existing||{name:'',birth:'',cpf:'',rg:'',address:'',phone:'',tripId:presetTripId,seat:'',value:'',paid:'',status:'Pendente'};let selectedTrip=p.tripId||presetTripId;openModal(`<h2>${id?'Editar':'Novo'} passageiro</h2><form onsubmit="savePerson(event,'${id||''}')"><div class="formgrid"><div class="field"><label>Nome completo</label><input name="name" value="${esc(p.name)}" required></div><div class="field"><label>Data de nascimento</label><input type="date" name="birth" value="${p.birth||''}" required></div><div class="field"><label>CPF</label><input name="cpf" value="${esc(p.cpf)}" required></div><div class="field"><label>Identidade / RG</label><input name="rg" value="${esc(p.rg)}" required></div><div class="field full"><label>Endereço completo</label><input name="address" value="${esc(p.address)}" required></div><div class="field"><label>Telefone / WhatsApp</label><input name="phone" value="${esc(p.phone)}" required></div><div class="field"><label>Excursão</label><select name="tripId"><option value="">Selecione</option>${data.trips.map(t=>`<option value="${t.id}" ${selectedTrip==t.id?'selected':''}>${esc(t.destination)} — ${fmt(t.departure)}</option>`).join('')}</select></div><div class="field"><label>Veículo</label><select name="vehicleIndex"><option value="">Selecione</option>${(data.trips.find(t=>t.id==selectedTrip)?.vehicles||[]).map((v,i)=>`<option value="${i}" ${Number(p.vehicleIndex||0)===i?'selected':''}>${esc(vehicleLabel(v,i))} · ${v.seats} lugares</option>`).join('')}</select></div><div class="field"><label>Assento</label><input name="seat" value="${esc(p.seat||'')}" placeholder="Ex.: 12"></div><div class="field"><label>Valor da viagem</label><input type="number" step="0.01" min="0" name="value" value="${p.value||''}"></div><div class="field"><label>Status</label><select name="status"><option ${p.status==='Pendente'?'selected':''}>Pendente</option><option ${p.status==='Parcial'?'selected':''}>Parcial</option><option ${p.status==='Confirmado'?'selected':''}>Confirmado</option><option ${p.status==='Cancelado'?'selected':''}>Cancelado</option></select></div></div><div class="notice" style="margin-top:12px">💳 O pagamento pode ser atualizado manualmente aqui, mesmo quando a venda foi feita fora do portal do cliente.</div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>${id?`<button type="button" class="btn secondary" onclick="closeModal();paymentForm('${id}')">💳 Ver pagamentos</button>`:''}<button class="btn">Salvar</button></div></form>`)}
function savePerson(e,id){e.preventDefault();let f=new FormData(e.target),existing=id?data.people.find(p=>p.id==id):null,o={id:id||Date.now().toString(),name:f.get('name'),birth:f.get('birth'),cpf:f.get('cpf'),rg:f.get('rg'),address:f.get('address'),phone:f.get('phone'),tripId:f.get('tripId'),seat:f.get('seat'),vehicleIndex:f.get('vehicleIndex')===''?'':Number(f.get('vehicleIndex')),value:Number(f.get('value')||0),paid:existing?Number(existing.paid||0):0,status:f.get('status')};if(id)data.people[data.people.findIndex(p=>p.id==id)]=Object.assign({},existing,o);else data.people.push(o);closeModal();save();render('people')}

function paymentForm(pid){let p=data.people.find(x=>x.id==pid);if(!p)return;let arr=passengerPayments(pid),paid=paymentTotal(p),pending=Math.max(0,Number(p.value||0)-paid);openModal(`<h2>💳 Pagamentos — ${esc(p.name)}</h2><div class="cards" style="grid-template-columns:repeat(3,minmax(0,1fr));margin-bottom:16px"><div class="card"><small>Valor da viagem</small><strong>${money(p.value)}</strong></div><div class="card"><small>Total pago</small><strong>${money(paid)}</strong></div><div class="card"><small>Saldo</small><strong>${money(pending)}</strong></div></div><div class="section-heading"><div><h3>Histórico de pagamentos</h3><p class="muted">Cada lançamento fica registrado individualmente.</p></div><button class="btn" onclick="closeModal();newPayment('${pid}')">+ Registrar pagamento</button></div>${arr.length?`<table class="table"><tr><th>Data</th><th>Forma</th><th>Valor</th><th>Observação</th><th></th></tr>${arr.map(x=>`<tr><td>${fmt(x.date)}</td><td>${paymentMethodLabel(x.method)}</td><td><b>${money(x.amount)}</b></td><td>${esc(x.note||'—')}</td><td><button class="btn danger" onclick="deletePayment('${x.id}','${pid}')">Excluir</button></td></tr>`).join('')}</table>`:(p.paid?`<div class="notice">Pagamento anterior de ${money(p.paid)} está registrado no cadastro antigo. Ao registrar um novo pagamento, ele será incorporado ao histórico.</div>`:'<div class="empty">Nenhum pagamento registrado.</div>')}<div class="actions"><button class="btn secondary" onclick="closeModal()">Fechar</button></div>`)}
function newPayment(pid){let p=data.people.find(x=>x.id==pid);if(!p)return;openModal(`<h2>Registrar pagamento</h2><form onsubmit="savePayment(event,'${pid}')"><div class="formgrid"><div class="field"><label>Data</label><input type="date" name="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Forma de pagamento</label><select name="method"><option>Pix</option><option>Cartão</option><option>Dinheiro</option><option>Transferência</option></select></div><div class="field"><label>Valor</label><input type="number" step="0.01" min="0.01" max="${Math.max(0,Number(p.value||0)-paymentTotal(p)).toFixed(2)}" name="amount" value="${Math.max(0,Number(p.value||0)-paymentTotal(p)).toFixed(2)}" required></div><div class="field full"><label>Observação</label><input name="note" placeholder="Ex.: 2ª parcela, sinal, pagamento final..."></div></div><div class="notice">Saldo atual: <b>${money(Math.max(0,Number(p.value||0)-paymentTotal(p)))}</b></div><div class="actions"><button type="button" class="btn secondary" onclick="closeModal();paymentForm('${pid}')">Cancelar</button><button class="btn">Salvar pagamento</button></div></form>`)}
function savePayment(e,pid){e.preventDefault();let p=data.people.find(x=>x.id==pid);if(!p)return;let f=new FormData(e.target),amount=Number(f.get('amount')||0);if(amount<=0)return alert('Informe um valor válido.');let existing=passengerPayments(pid);if(!existing.length&&Number(p.paid||0)>0){data.payments.push({id:'legacy-'+pid,personId:pid,date:new Date().toISOString().slice(0,10),amount:Number(p.paid||0),method:'Transferência',note:'Pagamento anterior importado'});}data.payments.push({id:Date.now().toString(),personId:pid,date:f.get('date'),amount,method:f.get('method'),note:f.get('note')});p.paid=paymentTotal(p);p.status=paymentStatus(p);closeModal();save();setTimeout(()=>paymentForm(pid),50)}
function deletePayment(id,pid){if(!confirm('Excluir este pagamento?'))return;data.payments=data.payments.filter(x=>x.id!=id);let p=data.people.find(x=>x.id==pid);if(p){p.paid=paymentTotal(p);p.status=paymentStatus(p)}save();setTimeout(()=>paymentForm(pid),50)}
function delPerson(id){if(confirm('Excluir passageiro e seu histórico de pagamentos?')){data.people=data.people.filter(p=>p.id!=id);data.payments=data.payments.filter(x=>x.personId!=id);save();render('people')}}

function charterIsFinancial(c){return ['Fechado','Contratado','Em andamento','Concluído'].includes(c?.status||'');}
function charterFinancialContract(c){return charterIsFinancial(c)?Number(c.value||0):0;}
function charterFinancialReceived(c){return charterIsFinancial(c)?Number(c.deposit||0):0;}
function charterStatusClass(status){
  if(['Concluído'].includes(status)) return 'ok';
  if(['Cancelado'].includes(status)) return 'danger';
  if(['Fechado','Contratado','Em andamento','Concluído','Aprovado'].includes(status)) return 'ok';
  if(['Aguardando fechamento','Pendente','Em negociação','Orçamento','Orçamento solicitado'].includes(status)) return 'warn';
  return '';
}
function charterRemaining(c){
  if(!charterIsFinancial(c)) return 0;
  return Math.max(0, Number(c.value||0)-Number(c.deposit||0));
}
function charterStatusOptions(selected){
  const opts=['Aguardando fechamento','Pendente','Fechado','Em andamento','Concluído','Cancelado','Orçamento solicitado','Orçamento','Em negociação','Aprovado','Contratado'];
  return opts.map(x=>`<option ${selected===x?'selected':''}>${x}</option>`).join('');
}

function toggleQuoteMessageType(id){
  const type=document.getElementById('quoteMessageType')?.value||'quote';
  const unavailableWrap=document.getElementById('quoteUnavailableWrap');
  const preview=document.getElementById('quotePreview');
  const quoteFields=document.getElementById('quoteAnswerValue');
  const validity=document.getElementById('quoteAnswerValidity');
  const vehicle=document.getElementById('quoteAnswerVehicle');
  if(unavailableWrap) unavailableWrap.style.display=type==='unavailable'?'block':'none';
  [quoteFields,validity,vehicle].forEach(el=>{if(el){const field=el.closest('.field');if(field)field.style.opacity=type==='quote'?'1':'.55'}});
  if(preview){
    if(type==='custom'){
      preview.readOnly=false;
      preview.placeholder='Digite aqui a informação que deseja enviar ao cliente.';
      preview.value='Olá, '+((data.charters.find(x=>x.id==id)||{}).client||'')+'! 👋\n\n\nCL TUR Transporte & Turismo';
      preview.style.cursor='text';
      preview.style.background='white';
    }else{
      preview.readOnly=true;
      preview.style.cursor='default';
      preview.style.background='#f8fafc';
      preview.value=buildQuoteMessage(id);
    }
  }
}
function updateQuotePreview(id){
  const p=document.getElementById('quotePreview');
  const type=document.getElementById('quoteMessageType')?.value||'quote';
  if(p && type!=='custom') p.value=buildQuoteMessage(id);
}
function buildQuoteMessage(id){
  const c=data.charters.find(x=>x.id==id); if(!c)return '';
  const type=document.getElementById('quoteMessageType')?.value||'quote';
  const value=Number(document.getElementById('quoteAnswerValue')?.value||0);
  let validity=(document.getElementById('quoteAnswerValidity')?.value||'').trim(); if(validity && /^\d+$/.test(validity)) validity += ' dias';
  const vehicle=(document.getElementById('quoteAnswerVehicle')?.value||c.vehicle||'A definir');
  const custom=(document.getElementById('quotePreview')?.value||'').trim();
  const nl=String.fromCharCode(10);
  if(type==='unavailable'){
    return 'Olá, '+c.client+'! 👋'+nl+nl+
      'Agradecemos seu contato com a CL TUR Transporte & Turismo.'+nl+nl+
      'Recebemos sua solicitação de fretamento para:'+nl+
      '📍 Saída: '+(c.origin||'Não informado')+nl+
      '📍 Destino: '+(c.destination||'Não informado')+nl+
      '📅 Ida: '+(fmt(c.date)+(c.departureTime?' às '+c.departureTime:''))+nl+
      '📅 Retorno: '+(c.returnDate?fmt(c.returnDate)+(c.returnTime?' às '+c.returnTime:''):'Somente ida')+nl+
      '👥 Passageiros: '+(c.passengers||'Não informado')+nl+nl+
      '🚫 No momento, não temos veículo disponível para atender essa solicitação na data informada.'+nl+nl+
      'Se houver alteração na data, teremos prazer em verificar uma nova disponibilidade para você.'+nl+nl+
      'CL TUR Transporte & Turismo';
  }
  if(type==='custom'){
    return 'Olá, '+c.client+'! 👋'+nl+nl+
      (custom||'')+nl+nl+
      'CL TUR Transporte & Turismo';
  }
  let msg='Olá, '+c.client+'! 👋'+nl+nl+
    'Recebemos sua solicitação de fretamento da CL TUR.'+nl+nl+
    '📍 Saída: '+(c.origin||'Não informado')+nl+
    '📍 Destino: '+(c.destination||'Não informado')+nl+
    '📅 Ida: '+(fmt(c.date)+(c.departureTime?' às '+c.departureTime:''))+nl+
    '📅 Retorno: '+(c.returnDate?fmt(c.returnDate)+(c.returnTime?' às '+c.returnTime:''):'Somente ida')+nl+
    '👥 Passageiros: '+(c.passengers||'Não informado')+nl+
    '🚐 Veículo mais indicado: '+vehicle+nl+
    '💰 Valor do orçamento: '+(value?money(value):'A combinar');
  if(validity)msg+=nl+'⏳ Validade: '+validity;
  msg+=nl+nl+'CL TUR Transporte & Turismo';
  return msg;
}

function updateQuotePreview(id){
  const p=document.getElementById('quotePreview');
  const type=document.getElementById('quoteMessageType')?.value||'quote';
  if(p && type!=='custom') p.value=buildQuoteMessage(id);
}
function whatsappBR(phone){
  let n=String(phone??'').replace(/\D/g,'');
  if(n.startsWith('00')) n=n.slice(2);
  if(n.startsWith('55') && (n.length===12 || n.length===13)) return n;
  if(n.length===10 || n.length===11) return '55'+n;
  return n;
}
function sendQuoteWhatsApp(id){
  const c=data.charters.find(x=>x.id==id); if(!c)return;
  const type=document.getElementById('quoteMessageType')?.value||'quote';
  const value=Number(document.getElementById('quoteAnswerValue')?.value||0);
  if(type==='quote' && !value){alert('Informe o valor do orçamento antes de enviar.');return}
  if(type==='custom' && !(document.getElementById('quotePreview')?.value||'').trim()){alert('Digite a mensagem personalizada no quadro de mensagem antes de enviar.');return}
  if(type==='quote'){
    c.quoteValue=value;
    c.recommendedVehicle=document.getElementById('quoteAnswerVehicle')?.value||c.vehicle;
    if(!charterIsFinancial(c)) c.status='Aguardando fechamento';
  }else if(type==='unavailable'){
    if(!charterIsFinancial(c)) c.status='Aguardando fechamento';
  }else if(type==='custom'){
    if(!charterIsFinancial(c)) c.status='Aguardando fechamento';
  }
  c.updatedAt=new Date().toISOString();
  save();
  const phone=whatsappBR(c.phone);
  if(!phone || !(phone.length===12 || phone.length===13) || !phone.startsWith('55')){
    alert('O WhatsApp precisa ter DDD e número válido. Exemplo: 34991851948.');
    return;
  }
  const msg=buildQuoteMessage(id);
  const url='https://api.whatsapp.com/send?phone='+phone+'&text='+encodeURIComponent(msg);
  window.open(url,'_blank');
  closeModal();
}

function saveCharter(e,id){
  e.preventDefault();
  let f=new FormData(e.target);
  let old=id?data.charters.find(c=>c.id==id):null;
  let o={
    id:id||Date.now().toString(),
    client:f.get('client'),
    phone:f.get('phone'),
    origin:f.get('origin'),
    destination:f.get('destination'),
    date:f.get('date'),
    departureTime:f.get('departureTime')||'',
    returnDate:f.get('returnDate'),
    returnTime:f.get('returnTime')||'',
    passengers:Number(f.get('passengers')||0),
    vehicle:f.get('vehicle')||'A definir',
    quoteValue:Number(f.get('quoteValue')||0),
    value:Number(f.get('value')||0),
    deposit:Number(f.get('deposit')||0),
    status:f.get('status')||'Aguardando fechamento',
    notes:f.get('notes')||'',
    createdAt:old?.createdAt||new Date().toISOString(),
    updatedAt:new Date().toISOString()
  };
  if(id)data.charters[data.charters.findIndex(c=>c.id==id)]=o;
  else data.charters.push(o);
  closeModal();save();render('charters');
}
function delCharter(id){
  if(confirm('Excluir este fretamento? Esta ação não poderá ser desfeita.')){
    data.charters=data.charters.filter(c=>c.id!=id);
    save();render('charters');
  }
}

function parseMoneyBR(value){
  let v=String(value??'').trim().replace(/R\$\s?/g,'');
  if(v.includes(',')) v=v.replace(/\./g,'').replace(',','.');
  else v=v.replace(/[^0-9.-]/g,'');
  return Number(v)||0;
}

function calendar(){
  const now=new Date(), v=data.calendarView||{year:now.getFullYear(),month:now.getMonth()};
  data.calendarView=v;
  const first=new Date(v.year,v.month,1), last=new Date(v.year,v.month+1,0);
  const start=(first.getDay()+6)%7, days=last.getDate(), prevDays=new Date(v.year,v.month,0).getDate();
  const events={};
  const add=(date,e)=>{if(date)(events[date]??=[]).push(e)};
  data.trips.forEach(t=>{add(t.departure,{type:'trip',id:t.id,label:'Excursão • '+t.destination,color:'blue'});if(t.returnDate)add(t.returnDate,{type:'trip',id:t.id,label:'Retorno • '+t.destination,color:'blue'})});
  data.charters.forEach(c=>{add(c.date,{type:'charter',id:c.id,label:'Frete • '+c.destination,color:'red'});if(c.returnDate)add(c.returnDate,{type:'charter',id:c.id,label:'Retorno • '+c.destination,color:'red'})});
  let cells='', total=Math.ceil((start+days)/7)*7;
  for(let i=0;i<total;i++){
    const num=i-start+1; let d,muted=false;
    if(num<1){d=new Date(v.year,v.month-1,prevDays+num);muted=true}else if(num>days){d=new Date(v.year,v.month+1,num-days);muted=true}else d=new Date(v.year,v.month,num);
    const iso=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const ev=events[iso]||[], hasRed=ev.some(x=>x.color==='red');
    const cls=['cal-day'];if(muted)cls.push('muted-day');if(ev.length)cls.push(hasRed?'has-red':'has-blue');
    if(iso===new Date().toISOString().slice(0,10))cls.push('today');
    cells+=`<div class="${cls.join(' ')}"><div class="cal-num">${d.getDate()}</div>${ev.slice(0,3).map(e=>`<button class="cal-event ${e.color}" onclick="${e.type==='trip'?`render('trips');setTimeout(()=>seatMap('${e.id}'),80)`:`charterDetail('${e.id}')`}">${esc(e.label)}</button>`).join('')}${ev.length>3?`<div class="cal-more">+${ev.length-3} evento(s)</div>`:''}</div>`;
  }
  const title=first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'});
  main.innerHTML=layout('Calendário',`
    <div class="panel calendar-panel">
      <div class="calendar-head"><div><div class="admin-eyebrow">AGENDA OPERACIONAL</div><h2 style="margin:3px 0;text-transform:capitalize">${title}</h2><p class="muted">Dias livres, excursões próprias e fretamentos em uma visão mensal.</p></div>
      <div class="calendar-controls"><button class="btn secondary" onclick="calendarMove(-1)">‹</button><button class="btn secondary" onclick="calendarToday()">Hoje</button><button class="btn secondary" onclick="calendarMove(1)">›</button>
      <select onchange="calendarSetMonth(this.value)">${Array.from({length:12},(_,i)=>`<option value="${i}" ${i===v.month?'selected':''}>${new Date(2000,i,1).toLocaleDateString('pt-BR',{month:'long'})}</option>`).join('')}</select>
      <input type="number" min="2020" max="2100" value="${v.year}" onchange="calendarSetYear(this.value)"></div></div>
      <div class="calendar-legend"><span><i class="legend-dot free"></i>Dia livre</span><span><i class="legend-dot blue"></i>Excursão própria</span><span><i class="legend-dot red"></i>Fretamento</span></div>
      <div class="calendar-weekdays">${['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'].map(x=>`<div>${x}</div>`).join('')}</div><div class="calendar-grid">${cells}</div>
    </div>`);
}

function syncReservationNotifications(){const seenKey='cltur_people_seen_v1';let seen=[];try{seen=JSON.parse(localStorage.getItem(seenKey)||'[]')}catch(e){seen=[]}if(!localStorage.getItem(seenKey)){localStorage.setItem(seenKey,JSON.stringify(data.people.map(p=>p.id)));return}const seenSet=new Set(seen);data.people.filter(p=>!seenSet.has(p.id)).forEach(p=>addNotification({key:'reservation:'+p.id,kind:'reservation',title:'Nova reserva de excursão',text:`${p.name} foi cadastrado(a) na excursão ${tripName(p.tripId)}.`,tripId:p.tripId,personId:p.id}));localStorage.setItem(seenKey,JSON.stringify(data.people.map(p=>p.id)))}
function updateNotificationBadge(){const unread=getNotifications().filter(n=>!n.read),count=unread.length;const e=document.getElementById('notificationCount');if(e)e.textContent=count;const dot=document.getElementById('dashboardNotificationDot');if(dot)dot.classList.toggle('show',count>0);const alert=document.getElementById('dashboardNotificationAlert');if(alert){if(count){const latest=unread[0];alert.innerHTML=`<div class="notification-alert"><div class="left"><span class="bell">🔔</span><div><h3>${count===1?'Você tem 1 nova notificação':`Você tem ${count} novas notificações`}</h3><p>${esc(latest.title)}${latest.text?' · '+esc(latest.text):''}</p></div></div><button class="btn" onclick="openNotifications()">Ver notificações</button></div>`}else alert.innerHTML=''}}
function openNotifications(){const list=getNotifications();openModal(`<h2>🔔 Notificações</h2><p class="muted">Pedidos recebidos e atividades recentes.</p><div class="notification-list">${list.length?list.map(n=>`<div class="notification-item ${n.read?'read':''}" onclick="notificationOpen('${n.id}')"><div class="notification-icon">${n.kind==='freight'?'🚐':n.kind==='reservation'?'🚌':'🔔'}</div><div><b>${esc(n.title)}</b><p>${esc(n.text||'')}</p><small>${new Date(n.createdAt).toLocaleString('pt-BR')}</small></div>${n.read?'':'<span class="new-dot"></span>'}</div>`).join(''):'<div class="empty">Nenhuma notificação.</div>'}</div><div class="actions"><button class="btn secondary" onclick="markNotificationsRead()">Marcar todas como lidas</button><button class="btn" onclick="closeModal()">Fechar</button></div>`)}
function markNotificationsRead(){localStorage.setItem('cltur_notifications_v1',JSON.stringify(getNotifications().map(n=>({...n,read:true}))));updateNotificationBadge();closeModal()}
function notificationOpen(id){const list=getNotifications(),n=list.find(x=>x.id==id);if(!n)return;n.read=true;localStorage.setItem('cltur_notifications_v1',JSON.stringify(list));updateNotificationBadge();closeModal();if(n.charterId){render('charters');setTimeout(()=>charterDetail(n.charterId),80)}else if(n.tripId){render('people');setTimeout(()=>peopleDetail(n.tripId),80)}}
syncFreightNotifications();syncReservationNotifications();updateNotificationBadge()

function refreshNotificationsFromStorage(){
  syncFreightNotifications();
  syncReservationNotifications();
  updateNotificationBadge();
}
window.addEventListener('storage',function(e){
  if(e.key==='cltur_notifications_v1' || e.key===KEY){
    refreshNotificationsFromStorage();
  }
});
setInterval(refreshNotificationsFromStorage,1000);
// Renderiza o Dashboard somente após o DOM estar pronto.
// Há uma segunda tentativa curta como proteção contra carregamento/atualização do navegador.
function initCLTUR(){
  // Garante que as coleções estejam normalizadas antes do primeiro render.
  if(!Array.isArray(data.trips)) data.trips=[];
  if(!Array.isArray(data.people)) data.people=[];
  if(!Array.isArray(data.charters)) data.charters=[];
  if(!Array.isArray(data.expenses)) data.expenses=[];
  if(!Array.isArray(data.payments)) data.payments=[];
  const paint=()=>{
    try { render('dashboard'); }
    catch(err) {
      console.error('Falha ao carregar Dashboard:', err);
      // Mantém uma mensagem visível em vez de deixar a tela completamente vazia.
      main.innerHTML='<div class="panel" style="margin:24px"><h2>Dashboard</h2><p class="muted">Não foi possível carregar o painel. Recarregando os dados…</p></div>';
      setTimeout(()=>{ try { render('dashboard'); } catch(e) { console.error('Falha no segundo carregamento:', e); } }, 100);
    }
  };
  if(typeof queueMicrotask==='function') queueMicrotask(paint); else setTimeout(paint,0);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', initCLTUR, {once:true});
else initCLTUR();
</script></body></html>
